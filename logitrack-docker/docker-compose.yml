version: '3.8'

services:
  logitrack-postgres:
    image: postgres:17
    container_name: logitrack-db-container
    restart: unless-stopped
    environment:
      POSTGRES_USER: logitrack_user
      POSTGRES_PASSWORD: logitrack_password
      POSTGRES_DB: logitrack_db
    ports:
      - "5432:5432"
    volumes:
      - logitrack_postgres_data:/var/lib/postgresql/data

  logitrack-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logitrack-pgadmin-container
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@logitrack.com
      PGADMIN_DEFAULT_PASSWORD: admin_password_new
    ports:
      - "5050:80"
    depends_on:
      - logitrack-postgres

volumes:
  logitrack_postgres_data: